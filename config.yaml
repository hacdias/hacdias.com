baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 15
rssLimit: 20
pluralizelisttitles: false
removePathAccents: true
title: "@hacdias' corner"
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
summaryLength: 150

author:
  username: hacdias
  name: Henrique Dias
  avatar: https://hacdias.com/me-256.jpg
  cover: https://cdn.hacdias.com/photos/t/2020-09-leafs-2000x.jpeg
  url: https://hacdias.com

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Henrique is doing his Master's in Computer Science and Engineering while working on the
    most fascinating projects to decentralize the web at Protocol Labs.
taxonomies:
  tag: tags

menu:
  main:
  - name: About
    pre: 🧔
    url: /about/
    weight: 1
  - name: Stream
    pre: 🌊
    url: /all/
    weight: 2
  - name: Photos
    pre: 📸
    url: /photos/
    weight: 3
  - name: Notes
    pre: 📓
    url: /notes/
    weight: 4
  - name: Links
    pre: 📌
    url: /links/
    weight: 5
  - name: Follow
    pre: ⚡️
    url: /contact/
    weight: 6
  - name: More
    pre: 🌈
    url: /more/
    weight: 7

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: true
    lineNumbersInTable: false

mediaTypes:
  application/activity+json:
    suffixes:
    - as2

outputFormats:
  rss:
    baseName: feed
  jsonfeed:
    mediaType: application/json
    baseName: feed
    isPlainText: true

outputs:
  home:
    - html
  section:
    - html
    - jsonfeed
    - rss
  taxonomy:
    - html
    - jsonfeed
    - rss
  taxonomyTerm:
    - html
  page:
    - html
