baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 20
rssLimit: 20
pluralizelisttitles: false
removePathAccents: true
title: "@hacdias's blog"
pygmentsStyle: swapoff
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
pygmentsCodeFences: true
summaryLength: 150

author:
  name: Henrique Dias
  link: https://hacdias.com

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Hi there! I'm Henrique and I'm a B.Sc. student in Information Systems and Computer.
    Currently working at Protocol Labs on decentralizing the web.

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  rss:
    baseName: feed
  jsonfeed:
    mediaType: application/json
    baseName: feed
    isPlainText: true
  redir:
    mediaType: text/plain
    baseName: redirects
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - jsonfeed
    - rss
    - redir
  section:
    - html
    - jsonfeed
    - rss
  taxonomy:
    - html
    - jsonfeed
    - rss
  taxonomyTerm:
    - html
  page:
    - html
