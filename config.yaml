baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 10
rssLimit: 20
pluralizelisttitles: false
removePathAccents: true
title: "@hacdias's blog"
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
summaryLength: 150

author:
  username: hacdias
  name: Henrique Dias
  avatar: https://hacdias.com/me-256.jpg
  url: https://hacdias.com

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Henrique is finishing his Bachelor's degree in Computer Science and Engineering
    while working on the most fascinating projects to decentralize the web.

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: dracula

mediaTypes:
  application/activity+json:
    suffixes:
    - as2

outputFormats:
  rss:
    baseName: feed
  jsonfeed:
    mediaType: application/json
    baseName: feed
    isPlainText: true
  redir:
    mediaType: text/plain
    baseName: redirects
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - redir
  section:
    - html
    - jsonfeed
    - rss
  taxonomy:
    - html
    - jsonfeed
    - rss
  taxonomyTerm:
    - html
  page:
    - html
