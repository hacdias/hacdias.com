baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 20
rssLimit: 20
pluralizelisttitles: false
removePathAccents: true
title: "@hacdias's blog"
pygmentsStyle: swapoff
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
pygmentsCodeFences: true
summaryLength: 150
disableAliases: true

author:
  username: hacdias
  name: Henrique Dias
  avatar: https://hacdias.com/me-256.jpg
  url: https://hacdias.com

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Hi there! I'm Henrique and I'm a B.Sc. student in Information Systems and Computer.
    Currently working at Protocol Labs on decentralizing the web.
  activityPub:
    inbox:  https://api.hacdias.com/activitypub/inbox
    publicKeyPem: -----BEGIN PUBLIC KEY----------END PUBLIC KEY-----

taxonomies:
  tag: tags

module:
  imports:
  - path: github.com/hacdias/hugo-caddy-redirs

markup:
  goldmark:
    renderer:
      unsafe: true

mediaTypes:
  application/activity+json:
    suffixes:
    - as2

outputFormats:
  rss:
    baseName: feed
  jsonfeed:
    mediaType: application/json
    baseName: feed
    isPlainText: true
  as2:
    mediaType: "application/activity+json"
    baseName: index
    isPlainText: true

outputs:
  home:
    - html
    - jsonfeed
    - rss
    - redir
    - as2
  section:
    - html
    - jsonfeed
    - rss
  taxonomy:
    - html
    - jsonfeed
    - rss
  taxonomyTerm:
    - html
  page:
    - html
    - as2
