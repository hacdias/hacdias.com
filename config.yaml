baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 10
rssLimit: 20
pluralizelisttitles: false
removePathAccents: true
title: "@hacdias's blog"
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
summaryLength: 150

author:
  username: hacdias
  name: Henrique Dias
  avatar: https://hacdias.com/me-256.jpg
  cover: https://cdn.hacdias.com/photos/t/2020-09-leafs-2000x.jpeg
  url: https://hacdias.com

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Henrique is doing his Master's in Computer Science and Engineering while working on the
    most fascinating projects to decentralize the web at Protocol Labs.

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: dracula

mediaTypes:
  application/activity+json:
    suffixes:
    - as2

outputFormats:
  rss:
    baseName: feed
  jsonfeed:
    mediaType: application/json
    baseName: feed
    isPlainText: true
  as2:
    mediaType: 'application/activity+json'
    baseName: index
    isPlainText: true

outputs:
  home:
    - html
    - as2
  section:
    - html
    - jsonfeed
    - rss
  taxonomy:
    - html
    - jsonfeed
    - rss
  taxonomyTerm:
    - html
  page:
    - html
    - as2
