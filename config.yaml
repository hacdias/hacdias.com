baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 20
pluralizelisttitles: false
removePathAccents: true
title: Henrique Dias (@hacdias)
pygmentsStyle: native
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
pygmentsCodeFences: true

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Hi there! I'm Henrique and I'm a B.Sc. student in Information Systems and Computer.
    Currently working at Protocol Labs on decentralizing the web.

permalinks:
  categories: /:slug

markup:
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  rss:
    baseName: feed
  jsonfeed:
    mediaType: application/json
    baseName: feed
    isPlainText: true

outputs:
  home:
    - html
    - jsonfeed
  section:
    - html
    - jsonfeed
  taxonomy:
    - html
    - jsonfeed
  taxonomyTerm:
    - html
  page:
    - html
