baseurl: 'https://hacdias.com/'
languageCode: en
paginate: 20
pluralizelisttitles: false
removePathAccents: true
title: Henrique Dias (@hacdias)
pygmentsStyle: native
summarylength: 30
relativeURLs: true
enableRobotsTXT: true
pygmentsCodeFences: true

social:
  twitter: hacdias

params:
  emoji: 🧙‍♂️
  Description: >-
    Hi there! I'm Henrique and I'm a B.Sc. student in Information Systems and Computer.
    Currently working at Protocol Labs on decentralizing the web.

disableKinds:
  - taxonomy
  - taxonomyTerm

permalinks:
  blog: /:year/:month/:slug/

markup:
  goldmark:
    renderer:
      unsafe: true
