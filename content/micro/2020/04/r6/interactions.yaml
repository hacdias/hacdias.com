  url: https://jlelse.blog/micro/2020/04/staying-with-hugo/
  content: "I played a bit with 11ty today and came to the conclusion to stay with
    Hugo for now. Much of what Hugo brings with it (multilingual websites, taxonomies
    etc.) has to be done manually. Sure, 11ty is much more flexible and everything
    is somehow possible, but somehow it’s too much effort for me (at least for the
    moment). I have a working Hugo site and it would be best to stick with it for
    now and start thinking more about things I can blog about instead of just the
    site itself. And I should also focus on my studies…Or maybe I should build my
    own static site generator? \U0001F602"
