  url: https://commentpara.de/comment/678.htm
  content: |-
    Or you could also have a fully deployed pre prod environment and run end to end tests there.


    This would amount to less code (which is good) and reliance on on less libraries(also good)


    Besides.. you should already have a pre prod environment with full deployments - it's good practice. You just have to write the end-to-end tests.


    (I realise that it may sound like I'm trashing this idea.. but I'm not, the actual implementation is elegant.. it just looks like a case where you've answered  'can we do it?' before asking 'should we do it')


    Nevertheless good project from an academic perspective.
