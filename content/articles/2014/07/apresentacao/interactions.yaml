  content: "Photo by Isabel Soares\nHi, I’m Henrique (he/him)!\nI’m from a little
    town in Portugal \U0001F1F5\U0001F1F9 and I’m now pursuing my Master’s degree
    \U0001F393 in Computer Science and Engineering at TU/e, in Eindhoven. At the same
    time, I’m working at Protocol Labs on fascinating projects to help decentralize
    the web.\nI believe in transparency and openness, in a united Europe \U0001F1EA\U0001F1FA
    and that all citizens must have equal rights \U0001F3F3️‍\U0001F308. There are
    a lot of issues in the world and we are all part of them, and we all should work
    towards correcting them, making Earth a better place for all of us to live.\nI’m
    interested in how we can use computer networks to our advantage, prioritizing
    decentralized systems, capable of pushing the humanity forward. Web infrastructure,
    peer-to-peer systems, as well as human-computer interaction are at the core of
    my interests.\nBack in 2014, when I started this website, I wrote my first ever
    post, in Portuguese, where I said my goal as a Software Engineer would be to improve
    the world somehow. Even though it is a cliché, it doesn’t mean it is not true.
    I enjoy helping people, and we all should never forget that we live in a society
    so our actions matter.\n\U0001F914 The (un)story of my handle\nMost likely you’ve
    already noticed that my handle, @hacdias, reminds of the word ‘hack’. However,
    I can assure you they have nothing to do with each other. It was a mere coincidence
    between the first letters of my first name and middle names - ‘hac’ - and last
    name - ‘dias’ - that I happen to enjoy.\n✉️ Contact\n\U0001F393 Resume\n\U0001F4E6
    Projects\n⚙️ About This Website"
