{{ define "list/item" }}
  <article class='h-entry card'>
    {{ include "post/header" . }}

    {{ if .HasMore }}
      {{ with or .Excerpt .Description }}
        <div class='copy'>
          <div class='p-summary'>{{ md . }}</div>
        </div>
      {{ end }}
    {{ else }}
      {{ include "post/content" . }}
    {{ end }}

    {{ include "post/media" . }}
    {{ include "post/footer" . }}
  </article>
{{ end }}
