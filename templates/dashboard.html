{{ define "main" }}
  <main role='main'>
    <header>
      <h1>Dashboard</h1>
    </header>

    <style>
    .grid {
      display: grid;
      grid-gap: 0.5rem;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    }

    .copy pre {
      word-break: break-all;
      white-space: break-spaces;
    }
    </style>

    <div class="copy">
      <h2>Actions</h2>

      <div class='grid'>
        {{ range .Data.Actions }}
        <form method=POST>
          <input type='hidden' name='action' value='{{ . }}' />
          <button style='width: 100%'>{{ . }}</button>
        </form>
        {{ end }}
      </div>

      {{ if .Data.Success }}
        <div class="box">✅ Success!</div>
      {{ end }}

      <h2>Token</h2>

      <form id='token' method='post' class='block-form'>
        <input type='hidden' name='token' value='true' />
        <input required type='url' name='client_id' placeholder='Client ID'>
        <input required type='text' name='scope' placeholder='Scope'>
        <select name='expiry'>
          <option value='' disabled selected hidden>Expiry</option>
          <option value='7'>1 Week</option>
          <option value='90'>3 Months</option>
          <option value='180'>6 Months</option>
          <option value='0'>Infinity</option>
        </select>
        <button>Submit</button>
      </form>

      {{ with .Data.Token }}
        <pre>{{ . }}</pre>
      {{ end }}
    </div>
  </main>
{{ end }}

{{ define "dashboard" }}
  {{ template "base" . }}
{{ end }}
