{{ define "main" }}
  <main role='main'>
    <header>
      <h1>Dashboard</h1>
    </header>

    <style>
    form#token button,
    form#token input {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
    }

    form#token input[type="radio"] {
      display: inline;
      width: auto;
    }

    .copy ol {
      list-style: none;
      padding-left: 1rem;
    }

    .copy ol input {
      margin-right: 0.5rem;
    }

    .copy ol label {
      text-transform: capitalize;
    }

    .copy pre {
      word-break: break-all;
      white-space: break-spaces;
    }

    .admin-nav {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      background-color: var(--accent);
      color: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      font-weight: 600;
    }

    .admin-nav li {
      flex-grow: 1;
      margin:0 ;
    }

    .admin-nav a {
      text-align: center;
      display: block;
      padding: 0.5rem;
    }

    .admin-nav a:hover {
      background-color: rgba(0,0,0,.2);
    }
    </style>

    <div class="copy">
      <ul class="admin-nav">
        <li><a class=nl href="/new">New Post</a></li>
        <li><a class=nl href="/deleted">Deleted</a></li>
        <li><a class=nl href="/drafts">Drafts</a></li>
        <li><a class=nl href="/unlisted">Unlisted</a></li>
        <li><a class=nl href="/private">Private</a></li>
      </ul>

      <h2>Actions</h2>

      <form method=POST>
        <ol>
          <li><label><input type="radio" name="action" value="clear-cache" /> Clear Cache</label></li>
          <li><label><input type="radio" name="action" value="sync-storage" /> Sync Storage</label></li>
          <li><label><input type="radio" name="action" value="update-blogroll" /> Update Blogroll</label></li>
          <li><label><input type="radio" name="action" value="update-reads-statistics" /> Update Reads Statistics</label></li>
          <li><label><input type="radio" name="action" value="update-watches-statistics" /> Update Watches Statistics</label></li>
        </ol>

        <button type="submit" name="submit" value="do">Do</button>
      </form>

      {{ with .Data.Message }}
        <pre>{{ . }}</pre>
      {{ end }}

      <h2>Generate Token</h2>

      <form id="token" method=POST>
        <input type="hidden" name="action" value="token" />
        <input required type="url" name="client_id" placeholder="Client ID">
        <input required type="text" name="scope" placeholder="Scope">

        <p><strong>Token Expiry</strong></p>
        
        <ol>
          <li><label><input type="radio" name="expiry" value="7" checked> 1 Week</label></li>
          <li><label><input type="radio" name="expiry" value="90"> 3 Months</label></li>
          <li><label><input type="radio" name="expiry" value="180"> 6 Months</label></li>
          <li><label><input type="radio" name="expiry" value="-1"> Infinity</label></li>
        </ol>

        <button type="submit">Submit</button>
      </form>

      {{ with .Data.Token }}
        <pre>{{ . }}</pre>
      {{ end }}
    </div>
  </main>
{{ end }}

{{ define "dashboard" }}
  {{ template "base" . }}
{{ end }}
