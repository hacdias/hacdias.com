{{ define "main" }}
  <main role='main'>
    <header>
      <h1>Dashboard</h1>
    </header>

    <style>
    form#token > * {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
    }

    .grid {
      display: grid;
      grid-gap: 0.5rem;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    }

    .copy pre {
      word-break: break-all;
      white-space: break-spaces;
    }

    .admin-nav {
      display: flex;
      flex-wrap: wrap;
      background-color: var(--near-white);
      border-radius: var(--radius);
      border: var(--border) solid var(--light-white);
      overflow: hidden;
      font-weight: 600;
      text-align: center;
    }

    .admin-nav a {
      flex-grow: 1;
      padding: 0.5rem;
    }

    .admin-nav a:hover {
      background-color: rgba(0,0,0,.2);
    }
    </style>

    <div class="copy">
      <nav class="admin-nav">
        <a class=nl href="/new">📄 New</a>
        <a class=nl href="/private">🔒 Private</a>
        <a class=nl href="/drafts">🗃️ Drafts</a>
        <a class=nl href="/unlisted">🙈 Unlisted</a>
        <a class=nl href="/deleted">🗑️ Deleted</a>
      </nav>

      <h2>Actions</h2>

      <div class='grid'>
        {{ range .Data.Actions }}
        <form method=POST>
          <input type='hidden' name='action' value='{{ . }}' />
          <button style='width: 100%'>{{ . }}</button>
        </form>
        {{ end }}
      </div>

      {{ if .Data.Success }}
        <div class="box">✅ Success!</div>
      {{ end }}

      <h2>Token</h2>

      <form id='token' method='post'>
        <input type='hidden' name='token' value='true' />
        <input required type='url' name='client_id' placeholder='Client ID'>
        <input required type='text' name='scope' placeholder='Scope'>
        <select name='expiry'>
          <option value='' disabled selected hidden>Expiry</option>
          <option value='7'>1 Week</option>
          <option value='90'>3 Months</option>
          <option value='180'>6 Months</option>
          <option value='0'>Infinity</option>
        </select>
        <button>Submit</button>
      </form>

      {{ with .Data.Token }}
        <pre>{{ . }}</pre>
      {{ end }}
    </div>
  </main>
{{ end }}

{{ define "dashboard" }}
  {{ template "base" . }}
{{ end }}
