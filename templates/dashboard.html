{{ define "main" }}
  <main role='main'>
    <h1>Dashboard</h1>

    <style>
    form#token button,
    form#token input {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
    }

    .copy ol {
      list-style: none;
      padding-left: 1rem;
    }

    .copy ol input {
      margin-right: 0.5rem;
    }

    .copy ol label {
      text-transform: capitalize;
    }

    .copy pre {
      word-break: break-all;
      white-space: break-spaces;
    }
    </style>

    <div class="copy">
      <ul>
        <li><a href="/new">New Post</a></li>
      </ul>

      <h2>Actions</h2>

      <form method=POST>
        <ol>
          <li><label><input type="radio" name="action" value="clear-cache" /> Clear Cache</label></li>
          <li><label><input type="radio" name="action" value="sync-storage" /> Sync Storage</label></li>
          <li><label><input type="radio" name="action" value="update-blogroll" /> Update Blogroll</label></li>
        </ol>

        <button type="submit" name="submit" value="do">Do</button>
      </form>

      {{ with .Data.Message }}
        <pre>{{ . }}</pre>
      {{ end }}

      <h2>Generate Token</h2>

      <form id="token" method=POST>
        <input type="hidden" name="action" value="token" />
        <input required type="url" name="client_id" placeholder="Client ID">
        <input required type="text" name="scope" placeholder="Scope">
        <p><label><input type="checkbox" name="expiry" value="infinity"> Does not expire</label></p>
        <button type="submit">Submit</button>
      </form>

      {{ with .Data.Token }}
        <pre>{{ . }}</pre>
      {{ end }}
    </div>
  </main>
{{ end }}

{{ define "dashboard" }}
  {{ template "base" . }}
{{ end }}
