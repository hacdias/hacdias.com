{{ define "main" }}
  <main role='main'>
    <h1>Dashboard</h1>

    <ul>
      <li><a href="/new">New Post</a></li>
    </ul>

    <p>Actions</p>

    <form method=POST>
      <ul>
        <li><label><input type="checkbox" name="action" value="clear-cache" /> Clear Cache</label></li>
        <li><label><input type="checkbox" name="action" value="sync-storage" /> Sync Storage</label></li>
        <li><label><input type="checkbox" name="action" value="update-blogroll" /> Update Blogroll</label></li>
      </ul>

      <button type="submit" name="submit" value="do">Do</button>
    </form>
  </main>
{{ end }}

{{ define "dashboard" }}
  {{ template "base" . }}
{{ end }}
