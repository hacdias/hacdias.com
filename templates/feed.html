{{ define "feed" }}
  {{- $mf2 := .Helper }}
  {{- $type := $mf2.PostType }}

  {{- if eq $type "reply" }}
    {{ $url := $mf2.String $mf2.TypeProperty }}
    <p><em>Replied to <a href="{{ $url }}">{{ $url }}</a></em></p>
  {{- end }}

  {{ include "activitypub" . }}
  {{ include "post/media" . }}
{{ end }}
