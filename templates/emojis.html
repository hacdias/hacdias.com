{{ define "main" }}
  <main role='main'>
    {{ include "base/admin" . }}

    <header>
      <h1>{{ .Title }}</h1>
    </header>

    {{- with .Content }}
      <div class='copy'>{{ md . }}</div>
    {{- end }}

    <style>
      .emojis ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr) );
        grid-gap: 0.5rem;
      }

      .emojis li {
        background-color: var(--near-white);
        font-size: 1.5rem;
        padding: 0.5rem;
        text-align: center;
        margin: 0;
      }
    </style>

    <div class="emojis">
      <ul>
        {{ range .Data.Terms }}
          <li>
            <a href="{{ relURL (printf "/emojis/%s" .) }}">{{ . }}</a>
          </li>
        {{ end }}
      </ul>
    </div>
{{ end }}

{{ define "emojis" }}
  {{ template "base" . }}
{{ end }}
