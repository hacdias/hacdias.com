{{ define "main" }}
  <link rel="stylesheet" href="{{ .Assets.Path "editor.css" }}">
  <main role='main'>
    <link rel="stylesheet" href="{{ relURL "/vendor/leaflet/leaflet.css" }}" />
    <script src="{{ relURL "/vendor/leaflet/leaflet.js" }}"></script>

    <style>
      :root {
        --accent: #ffa633;
      }

      #map {
        aspect-ratio: 1 / 1;
      }
    </style>

    <form method='POST'>
      <input type='text' name='name' required placeholder='Name' />
      <input type='text' name='location' required hidden />
      <div id="map"></div>
      <input type='datetime-local' name='date' >
      <button>Check In</button>
    </form>
  </main>

  <script type='text/javascript'>
  const map = L.map('map').setView([48.1229329, 7.2293129], 5);
  let marker;

  const updateMarker = (lat, lng, zoom) => {
    if (marker) {
      map.removeLayer(marker);
    }
    marker = L.marker({ lat, lng }).addTo(map);
    map.setView([lat, lng], zoom);
    document.querySelector('input[name=location]').value = `geo:${lat},${lng}`
  }

  map.on('click', function(e) {
    if (e.latlng) {
      updateMarker(e.latlng.lat, e.latlng.lng);
    }
  });

  L.tileLayer('/tiles/{s}/{z}/{x}/{y}{r}', {
    attribution:
      '&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' +
      '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
    // For MapBox only
    tileSize: 512,
    zoomOffset: -1,
  }).addTo(map);

  navigator.geolocation.getCurrentPosition(function(position) {
    const latitude = (Math.round(position.coords.latitude * 100000) / 100000)
    const longitude = (Math.round(position.coords.longitude * 100000) / 100000)
    updateMarker(latitude, longitude, 18)
  }, console.error)

  </script>
{{ end }}

{{ define "new-checkin" }}
  {{ template "base" . }}
{{ end }}
