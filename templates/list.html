{{ define "main" }}
<main role='main'>
  <h1>{{ .Entry.Title }}</h1>

  {{ with .Entry.Content }}
    <div class='copy'>{{ . }}</div>
  {{ end }}

  <div class='h-feed'>

  {{ range .Entries }}
    {{ .Permalink }}
  {{ end }}
  </div>
</main>
{{ end }}

{{ define "list" }}
  {{ template "base" . }}
{{ end }}
