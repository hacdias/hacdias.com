{{ define "main" }}
<main role='main'>
  {{ include "base/admin" . }}
  <header>
    <h1>{{ .Title }}{{ with .Data.Page }} ({{.}}){{ end }}</h1>
  </header>

  {{ with .Content }}
    <div class='copy'>{{ md . }}</div>
  {{ end }}

  <style>
  .h-feed > a {
    display: grid;
    grid-column-gap: var(--hms);
    grid-template-columns: 1fr min-content;
    margin: var(--hms) 0;
  }

  .h-feed .p-name {
    font-weight: 600;
  }

  @media screen and (max-width: 52rem) {
    .h-feed > a, .h-feed .p-name, .h-feed time {
      display: block;
    }
  }
  </style>

  <div class='h-feed'>
  {{ range .Data.Entries }}
    <a class='h-entry nl' href="{{ relURL .Permalink }}">
      <span class='p-name'>{{ .Title }}</span>
      <time class='tab dt-published' datetime='{{ .Published.Format "2006-01-02T15:04:05Z07:00" }}'>{{ .Published.Format "02-01-2006" }}</time>
    </a>
  {{ end }}
  </div>

</main>
{{ end }}

{{ define "plain-list" }}
  {{ template "base" . }}
{{ end }}
