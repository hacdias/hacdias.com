{{ define "main" }}

<main role='main'>
  {{ $type := .Helper.PostType }}
  <article class='{{ if ne $type "article" }}card {{ end }}h-entry'>
    {{ include "post/header" . }}
    {{ include "post/content" . }}
    {{ include "post/media" . }}
    {{ include "post/footer" . }}
  </article>

  {{ include "post/webmentions" . }}
</main>

{{ end }}

{{ define "single" }}
  {{ template "base" . }}
{{ end }}
