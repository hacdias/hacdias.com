{{ define "main" }}

<main role='main'>
  <article class='h-entry'>
    {{ include "post/header" . }}

    {{ with .Entry.Content }}
      <div class='copy e-content {{ if not $.Entry.Title }}p-name{{ end }}'>{{ md . }}</div>
    {{ end }}

    {{ include "post/footer" . }}

    {{ if not .Entry.NoInteractions }}
      {{ include "post/webmentions" . }} 
    {{ end }}
  </article>
</main>

{{ end }}

{{ define "single" }}
  {{ template "base" . }}
{{ end }}
