{{ define "main" }}

<main role='main'>
  <header>

    {{ with .Entry.Title }}<h1 class='p-name'>{{- . -}}</h1>{{ end }}
  </header>

  {{ with .Entry.Content }}
    <div class='copy e-content {{ if not $.Entry.Title }}p-name{{ end }}'>{{ . }}</div>
  {{ end }}

  {{ if not .Entry.NoInteractions }}
    <div>TODO: Interactions<div>
  {{ end }}
</main>

{{ end }}

{{ define "single" }}
  {{ template "base" . }}
{{ end }}
