{{ define "main" }}

<main role='main'>
  <article class='h-entry'>
    {{ include "base/admin" . }}
    {{ include "post/header" . }}

    {{ with .Entry.Content }}
      <div class='copy e-content {{ if not $.Entry.Title }}p-name{{ end }}'>{{ md . }}</div>
    {{ end }}

    {{ include "post/photos" . }}
    {{ include "single/footer" . }}
  </article>
</main>

{{ end }}

{{ define "single" }}
  {{ template "base" . }}
{{ end }}
