{{ define "base/admin" }}
  {{ if .IsLoggedIn }}
    <style>
    :root {
      border-top: var(--border) solid var(--light-white);
    }

    #admin-navbar {
      display: flex;
      background: var(--white);
      border: var(--border) solid var(--light-white);
      border-top: 0;
      overflow: hidden;
      text-align: center;
      font-weight: 700;
      margin-top: calc(-1 * var(--ms) - var(--border));
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
    }

    #admin-navbar label,
    #admin-navbar a {
      flex-grow: 1;
      display: block;
      padding: var(--hms);
      cursor: pointer;
    }

    #admin-navbar label {
      display: none;
    }

    #admin-navbar a:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    @media screen and (max-width: 52rem) {
      #admin-navbar,
      #admin-navbar label,
      #admin-toggler:checked + #admin-navbar a {
        display: block;
        text-align: left;
      }

      #admin-navbar {
        margin-left: 0;
        width: 100%;
      }

      #admin-navbar a {
        display: none;
      }
    }
    </style>

    <script>
    document.querySelector('meta[name=theme-color]').content = '#ffffff';
    </script>

    <input type='checkbox' id='admin-toggler' hidden>
    <nav id='admin-navbar' class='fw'>
      <label for="admin-toggler">🍞 Menu</label>
      <a class='nl' href='/dashboard'>🎛️ Dashboard</a>
      <a class='nl' href='/new'>📄 New</a>
      <a class='nl' href="/edit{{ .Entry.ID }}">✏️ Edit</a>
      <a class='nl' href='/drafts'>🗃️ Drafts</a>
      <a class='nl' href='/unlisted'>🙈 Unlisted</a>
      <a class='nl' href='/deleted'>🗑️ Deleted</a>
    </nav>
  {{ end }}
{{ end }}
