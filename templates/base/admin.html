{{ define "base/admin" }}
  {{ if .IsLoggedIn }}
    <style>
    body {
      padding-bottom: 37px;
    }

    #admin {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 99999;
      background: var(--white);
      border-top: var(--border) solid var(--light-white);
    }

    #admin > div {
      max-width: var(--max-width);
      padding: 0 var(--ls);
      margin: 0 auto;
    }

    #admin-navbar {
      display: flex;
      overflow: hidden;
      text-align: center;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 0;
    }

    #admin-navbar label,
    #admin-navbar a {
      flex-grow: 1;
      display: block;
      padding: var(--hms);
      cursor: pointer;
    }

    #admin-navbar label {
      display: none;
    }

    #admin-navbar a:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    @media screen and (max-width: 52rem) {
      #admin-navbar,
      #admin-navbar label,
      #admin-toggler:checked + #admin-navbar a {
        display: block;
        text-align: left;
      }

      #admin-navbar {
        margin-left: 0;
        width: 100%;
      }

      #admin-navbar a {
        display: none;
      }
    }
    </style>

    <div id='admin'>
      <div>
        <input type='checkbox' id='admin-toggler' hidden>
        <nav id='admin-navbar' class='fw'>
          <label for="admin-toggler">🍞 Menu</label>
          <a class='nl' href='/dashboard'>🎛️ Dashboard</a>
          <a class='nl' href='/new'>📄 New</a>
          <a class='nl' href="/edit{{ .Entry.ID }}">✏️ Edit</a>
          <a class='nl' href='/drafts'>🗃️ Drafts</a>
          <a class='nl' href='/unlisted'>🙈 Unlisted</a>
          <a class='nl' href='/deleted'>🗑️ Deleted</a>
          <a class='nl' href='/logout'>🚪 Logout</a>
        </nav>
      </div>
    </div>
  {{ end }}
{{ end }}
