{{ define "base/admin" }}
  {{ if .IsAdmin }}
    <style>
    #edit-btn {
      position: fixed;
      bottom: 1rem;
      z-index: 999999;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: rgba(99,99,99,.2)0 2px 8px;
    }
    </style>
    <a id="edit-btn" href="/edit/{{ .Entry.ID }}"><button>Edit</button></a>
  {{ end }}
{{ end }}
