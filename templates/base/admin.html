{{ define "base/admin" }}
  {{ if .IsLoggedIn }}
    <style>
    #admin-navbar {
      background: var(--white);
      border-bottom: var(--border) solid var(--light-white);
      overflow: hidden;
      text-align: center;
      font-weight: 700;
      margin-top: calc(-1 * var(--ms) - var(--border));
      margin-bottom: var(--ms);
      position: sticky;
      top: 0;
      z-index: 99999;
    }

    #admin-navbar > div {
      display: flex;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--hms);
    }

    #admin-navbar label,
    #admin-navbar a {
      flex-grow: 1;
      display: block;
      padding: var(--hms);
      cursor: pointer;
    }

    #admin-navbar label {
      display: none;
    }

    #admin-navbar a:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    @media screen and (max-width: 52rem) {
      #admin-navbar > div,
      #admin-navbar label,
      #admin-toggler:checked + #admin-navbar a {
        display: block;
        text-align: left;
      }

      #admin-navbar {
        margin-left: 0;
        width: 100%;
      }

      #admin-navbar a {
        display: none;
      }
    }
    </style>

    <script>
    document.querySelector('meta[name=theme-color]').content = '#ffffff';
    </script>

    <input type='checkbox' id='admin-toggler' hidden>
    <nav id='admin-navbar'>
      <div>
        <label for="admin-toggler">🍞 Menu</label>
        <a class='nl' href='/dashboard'>🎛️ Dashboard</a>
        <a class='nl' href='/new'>📄 New</a>
        <a class='nl' href="/edit{{ .Entry.ID }}">✏️ Edit</a>
        <a class='nl' href='/drafts'>🗃️ Drafts</a>
        <a class='nl' href='/unlisted'>🙈 Unlisted</a>
        <a class='nl' href='/deleted'>🗑️ Deleted</a>
      </div>
    </nav>
  {{ end }}
{{ end }}
