{{ define "base/footer" }}
<footer id='footer'>
  <div>
    <div>
      {{ if .OnionAddress }}
        {{ if .TorUsed }}
          🔐 You are connected via Tor.
        {{ else }}
          🔓 <a href="{{ .OnionAddress }}">Connect via Tor.</a> <a href="https://www.torproject.org/">What is Tor?</a>
        {{ end }}
      {{ end }}
    </div>

    <div>
      {{ if .LoggedIn }}
        <a href="{{ relURL "/dashboard" }}">Dashboard</a>
        <a href="{{ relURL "/logout" }}">Logout</a>
      {{ else }}
        <a href="{{ relURL "/login" }}">Login</a>
      {{ end }}
    </div>
  </div>

  <div>
    <div>
      &copy; Henrique Dias 2014 - {{ now.Year }}
    </div>

    <div>
      <a title="IndieWeb Webring (Previous)" class="nl" target="_blank" rel="noreferrer noopener" href="https://xn--sr8hvo.ws/%F0%9F%91%99%F0%9F%88%B6%F0%9F%98%BD/previous">←</a>
      🕸💍
      <a title="IndieWeb Webring (Next) "class="nl" target="_blank" rel="noreferrer noopener" href="https://xn--sr8hvo.ws/%F0%9F%91%99%F0%9F%88%B6%F0%9F%98%BD/next">→</a>
    </div>
  </div>

  <div>
    <div>
      <a href="https://indieweb.org/" class="nl" target="_blank" rel="noreferrer noopener"><img alt="IndieWeb" class="pixelated" src="{{ relURL "/images/indieweb.png" }}"></a>
      <a href="https://microformats.org/" class="nl" target="_blank" rel="noreferrer noopener"><img alt="Microformats" class="pixelated" src="{{ relURL "/images/microformats.png" }}"></a>
      <a href="https://indieweb.org/Webmention" class="nl" target="_blank" rel="noreferrer noopener"><img alt="Webmentions" class="pixelated" src="{{ relURL "/images/webmention.png" }}"></a>
    </div>
    <div>🇵🇹🇪🇺🏳️‍🌈</div>
  </div>
</footer>
{{ end }}
