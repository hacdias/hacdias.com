{{ define "base/header" }}
  <nav id='navbar' class="fw">
    <input type="checkbox" id="toggler">
    <ul>
      <li><a class='nl' href='{{ relURL "/" }}'>Henrique Dias</a></li>
      {{ range .Site.Menus.main -}}
        <li>
          <a href='{{ relURL .Link }}' class='nl'>{{ .Name }}</a>
        </li>
      {{ end }}
      <li>
        <form action="{{ relURL "/search" }}" method="get">
          <input required type="text" placeholder='Search…' id="query" name="query">
        </form>
      </li>
    </ul>
    <div>
      <a class='nl' href='{{ relURL "/" }}'>Henrique Dias</a>
      <label for="toggler">Menu 🍔</label>
    </div>
  </nav>
{{ end }}
