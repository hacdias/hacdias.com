{{ define "base/header" }}
  <div id='header'>
    <a class='nl' href='{{ relURL "/" }}'>
      <img class="logo" alt='Logo' src="{{ relURL "/logo.svg" }}">
      <div>
        <p class='name'>Henrique Dias</p>
        <p class='aka'>known as @hacdias</p>
      </div>
    </a>

    <form action="{{ relURL "/search" }}" method="get" class="inline-form">
      <input required type="text" placeholder='Search…' id="query" name="query">
    </form>
  </div>
  
  <label id='nav-toggler' class='fw' for="toggler">🍔 Menu</label>
  <input type="checkbox" id="toggler" class='dn'>
  <nav id='navbar' class="fw">
    {{ range .Site.Menus.main -}}
      {{ $url := relURL .Link }}
      <a href='{{ $url }}' class='nl{{ if eq $url $.ID }} active{{ end }}'>{{ .Emoji }} {{ .Name }}</a>
    {{ end }}
    {{ if .IsLoggedIn }}
      {{ if .IsAdmin }}<a href='{{ relURL "/dashboard" }}' class='nl'>🎛 Admin</a>
      {{ else }}<a href='{{ relURL "/private" }}' class='nl'>🔒 Private</a>
      {{ end }}
    {{ end }}
  </nav>
{{ end }}
