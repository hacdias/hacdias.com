{{ define "base/header" }}
  <div id='header'>
    <div>
      <a class='nl' href='{{ relURL "/" }}'>
        <img class="logo" alt='Logo' src="{{ relURL "/logo.svg" }}">
        <div>
          <p class='name'>Henrique Dias</p>
          <p class='aka'>aka @hacdias</p>
        </div>
      </a>
      <label for="toggler">Menu 🍔</label>
    </div>

    {{ if not (eq .Entry.Title "Search") }}
      <form action="{{ relURL "/search" }}" method="get" class="inline-form">
        <input required type="text" placeholder='Search…' id="query" name="query">
      </form>
    {{ end }}
  </div>

  <nav id='navbar' class="fw">
    <input type="checkbox" id="toggler">
    <ul>
      {{ range .Site.Menus.main -}}
        <li>
          <a href='{{ relURL .Link }}' class='nl'>{{ .Emoji }} {{ .Name }}</a>
        </li>
      {{ end }}
    </ul>
  </nav>
{{ end }}
