{{ define "base/header" }}
  <div id='header'>
    <a class='nl' href='{{ relURL "/" }}' id='home'>
      <picture class="avatar">
        <source type="image/webp" srcset="{{ relURL "/avatar.webp" }}">
        <img alt='Avatar' src="{{ relURL "/avatar.png" }}">
      </picture>

      <div>
        <p class='name'>Henrique Dias <span id='egg'></span></p>
        <p class='aka'>aka @hacdias</p>
      </div>
    </a>

    <form action="{{ relURL "/search" }}" method="get" class="inline-form">
      <input required type="text" placeholder='Search…' id="query" name="query">
      <input type='submit' value='Go' />
    </form>

    <a href="{{ relURL "/search" }}" alt="Search" class='nl' id='mobile-search'>
      <button>🔎</button>
    </a>
  </div>

  <input type="checkbox" id="toggler" class='dn'>
  <nav id='navbar' class="fw">
    <label for="toggler">🍔 Menu</label>
    {{ range .Site.Menus.main -}}
      {{ $url := relURL .Link }}
      <a href='{{ $url }}' class='nl{{ if eq $url $.ID }} active{{ end }}'>{{ .Emoji }} {{ .Name }}</a>
    {{ end }}
    {{ if .IsLoggedIn }}
      {{ if .IsAdmin }}<a href='{{ relURL "/dashboard" }}' class='nl'>🎛 Admin</a>
      {{ else }}<a href='{{ relURL "/private" }}' class='nl'>🔒 Private</a>
      {{ end }}
    {{ end }}
  </nav>
{{ end }}
