{{ define "main" }}
  <main role='main' id="editor-page">
    {{ with .Data.Title }}
      <header>
        <h1>{{- . -}}</h1>
      </header>
    {{ end }}

    {{ include "editor/css" . }}

    <form method=POST>
      <textarea required id=content name=content>{{ .Data.Content }}</textarea>

      <div class=options>
         <label><input type=checkbox name=lastmod {{ if not .Entry.Published.IsZero }}checked{{end }} /> Update Modification Date</label>
      </div>

      {{ with .Data.Syndicators }}
      <div class=options>
        <p><strong>Syndications</strong></p>
        {{ range . }}
          <label><input type=checkbox name=syndication value="{{ .UID }}"> {{ .Name }}</label>
        {{ end }}
      </div>
      {{ end }}

      <button type="submit" name="action" value="update">Update</button>
    </form>
  </main>
{{ end }}

{{ define "editor" }}
  {{ template "base" . }}
{{ end }}
