{{ define "main" }}
  <link rel='stylesheet' href='{{ .Assets.Path "editor.css" }}'>
  <main role='main'>
    <form>
      <input type='text' disabled value='{{ .Data.Entry.ID }}' />
    </form>

    <details class='box'>
      <summary>Rename</summary>
      <p><small>Please write the new slug of the post.</small></p>
      <form method='post'>
        <input type='text' name='rename' placeholder='New ID' value='{{ .Data.Entry.ID }}' required />
        <button>Rename</button>
      </form>
    </details>

    <details class='box'>
      <summary>ActivityPub</summary>
      <p><small>Please choose which Activity type to send.</small></p>

      <form method='post' action='/activitypub/manual'>
        <input required type="hidden" name="id" value='{{ .Data.Entry.ID }}'>
        <select name='action' style='width: 100%'>
          <option value='' selected disabled hidden>Activity</option>
          <option value='announce'>Announce</option>
          <option value='create'>Create</option>
          <option value='delete'>Delete</option>
          <option value='like'>Like</option>
          <option value='update'>Update</option>
          <option value='undo'>Undo</option>
        </select>
        <button>Send</button>
      </form>
    </details>

    <form method='post'>
      <textarea required name='content'>{{ .Data.Content }}</textarea>
      <div class=options>
        <label><input type='checkbox' name='lastmod' {{ if not .Data.Entry.Published.IsZero }}checked{{end }} /> Update Modification Date</label>
      </div>
      {{ include "editor/syndicators" . }}
      <button>Update</button>
    </form>
  </main>
  <script type='text/javascript' src='{{ .Assets.Path "editor.js" }}'></script>
{{ end }}

{{ define "editor" }}
  {{ template "base" . }}
{{ end }}
