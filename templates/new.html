{{ define "main" }}
  <link rel="stylesheet" href="{{ .Assets.Path "editor.css" }}">
  <main role='main' id="editor-page">
    <header>
      <h1>New</h1>
    </header>

    <p>
      <strong>Templates:</strong>
      {{ range .Data.Templates }}
        <a href="?template={{.}}">{{ . }}</a>
      {{ end }}
    </p>

    <form method=POST>
      <input type="text" required name="id" placeholder="id" value="{{ .Data.ID }}" />
      <textarea required id=content name="content">{{ .Data.Content }}</textarea>

      {{ include "editor/syndicators" . }}
      <button>Create</button>
    </form>
  </main>
  <script type="text/javascript" src="{{ .Assets.Path "editor.js" }}"></script>
{{ end }}

{{ define "new" }}
  {{ template "base" . }}
{{ end }}
