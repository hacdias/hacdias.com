{{ define "main" }}
  <main role='main'>
    <header>
      <h1>{{ .Entry.Title }}</h1>
    </header>

    <div class="copy">
      <ul>
        {{ range .Data.Followers }}
          <li><a href='{{ .ID }}'>{{ .Handle }}</a>{{with .Name }} ({{ . }}){{ end }}</li>
        {{ end }}
      </ul>
    </div>
  </main>
{{ end }}

{{ define "activitypub-followers" }}
  {{ template "base" . }}
{{ end }}
