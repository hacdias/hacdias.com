{{ define "main" }}

<main role='main'>
  <article class='h-entry card'>
    {{ $mm := .Helper }}

    {{ with .Location }}
      {{ include "map" . }}
      <script>
      const lat = {{ .Latitude }};
      const lon = {{ .Longitude }};
      map.setView([lat, lon], {{ with $mm.Int "zoom" }}{{ . }}{{ else }}12{{ end }})
      </script>
    {{ end }}

    {{ include "post/header" . }}
    {{ include "post/content" . }}
    {{ include "post/media" . }}
  </article>

  {{ include "list/list" . }}
</main>

{{ end }}

{{ define "trip" }}
  {{ template "base" . }}
{{ end }}
