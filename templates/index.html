{{ define "main" }}
  <main role="main">
    {{ include "base/admin" . }}
  
    <div class="copy">
      {{ md .Content }}
      
      <h3 id=latest>🚀 Latest{{ with .Data.Page }} ({{.}}){{ end }}</h3>

      <div class=box>
        <p>The posts in this home page are semi-curated, which means that you do not see <a href="{{ relURL "/all" }}">everything</a>.</p>
      </div>
    </div>

    {{ include "list/list" . }}
  </main>
{{ end }}

{{ define "index" }}
  {{ template "base" . }}
{{ end }}
