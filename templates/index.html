{{ define "main" }}
  <main role="main" {{ if eq .Data.Page 0 }}class="home"{{ end }}>
    {{ include "base/admin" . }}

    <div class="copy">
      {{ if eq .Data.Page 0 }}
        {{ include "post/content" . }}
        <h3>🌻 Latest Posts</h3>
      {{ else }}
        <header><h1 class="p-name">🌻 Latest Posts {{ with .Data.Page }} ({{.}}){{ end }}</h1></header>
      {{ end }}

      {{ include "list/list" . }}
    </div>
  </main>
{{ end }}

{{ define "index" }}
  {{ template "base" . }}
{{ end }}
