{{ define "main" }}
    <style>
    #submit,
    #username,
    #password {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
    }
    </style>

  <main role='main' id="login-page">
    <header>
      <h1>Login</h1>
    </header>

    <div class=copy>
      <form method='post'>
        <input required name='username' id='username' type='text' placeholder='Username' />
        <input required name='password' id='password' type='password' placeholder='Password' />
        <button id='submit'/>Login</button>
      </form>
    </div>
  </main>
{{ end }}

{{ define "login" }}
  {{ template "base" . }}
{{ end }}
