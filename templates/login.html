{{ define "main" }}
  <main role='main' id="login-page">
    <header>
      <h1>Login</h1>
    </header>

    <div class=copy>
      <p>You can login with your domain using the <a href="https://indieauth.spec.indieweb.org/" rel="noreferrer noopener">IndieAuth</a> protocol. After logging in, you will have access to posts that are restricted to logged in users only. Perhaps there's even posts that only you can see.</p>
    </div>

    <form method=POST class='inline-form'>
      <input required type='profile' name='profile' placeholder='yourdomain.com' />
      <button/>Login</button>
    </form>
  </main>
{{ end }}

{{ define "login" }}
  {{ template "base" . }}
{{ end }}
