{{ define "main" }}
  <main role='main' id="login-page">
    <h1>Login</h1>

    <p>Login with your domain. After logging in, you will have access to more posts.</p>

    <form method=POST class='inline-form'>
      <input required type='profile' name='profile' placeholder='yourdomain.com' />
      <input type='submit' value='Login' />
    </form>
  </main>
{{ end }}

{{ define "login" }}
  {{ template "base" . }}
{{ end }}
