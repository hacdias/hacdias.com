{{ define "base" }}
<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
  {{ include "base/head" . }}
</head>
<body>
  <div class='container'>
    {{ include "base/header" . }}
    {{ template "main" . }}
    {{ include "base/footer" . }}
  </div>

  <script type="text/javascript" src="{{ index .Assets "app.js" }}"></script>
</body>
</html>
{{ end }}
