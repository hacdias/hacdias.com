{{ define "base" }}
<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
  {{ include "base/head" . }}
</head>
<body {{ with .Section }}class="s-{{. }}"{{ end }}>
  <div class='container'>
    {{ include "base/header" . }}
    {{ template "main" . }}
    {{ include "base/footer" . }}
  </div>

  <script type="text/javascript" src="{{ relURL "/js/vendor/twemoji.min.js" }}"></script>
  <script type="text/javascript" src="{{ relURL "/js/app.js" }}"></script>
</body>
</html>
{{ end }}
