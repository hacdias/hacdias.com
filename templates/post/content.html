{{ define "post/content" }}
  {{- $mf2 := .Helper }}
  {{ $rating := $mf2.Int "rating" }}

  {{ if or .Content $rating }}
    <div class='copy e-content'>
      {{ with $rating }}
        <p>
          <data class="p-rating" value="{{ . }}"><strong>Rating</strong>: {{ stars . 5 }}</data>
        </p>
      {{ end }}

      {{- with .Content }}{{ md . }}{{ end -}}
    </div>
  {{ end }}
{{ end }}
