{{ define "post/media" }}
  {{ with .Helper.Photos }}
    <div class="fw {{ with $.PhotoClass}}{{.}}{{ end }}">
    {{ range $i, $photo := . }}
      <figure>
        <picture>
          {{ with imageSourceSet $photo.value }}
            {{ range . }}
              <source srcset="{{ .Images }}" type="image/{{ .Type }}" />
            {{ end }}
          {{ end }}
          <img src="{{ imageURL $photo.value }}" class="u-photo" loading="lazy" {{ with $photo.alt }}alt="{{ . }}"{{ end }}>
        </picture>
      </figure>
    {{ end }}
    </div>
  {{ end }}

  {{ with .Helper.Videos }}
    <div class="fw">
    {{ range $i, $video := . }}
      <video controls {{ with $video.alt }}poster="{{ . }}"{{ end }}>
        <source class="u-video" src="{{ $video.value }}">
      </video>
    {{ end }}
    </div>
  {{ end }}

  {{/* {{ with .Helper.Audios }}

    {{ range $i, $audio := . }}

      {{ with .alt }}<figcaption>{{ . }}</figcaption> {{ end }}
      <audio controls>
        <source class="u-audio" src="{{ .value }}">
      </audio>
    </figure>
    {{ end }}
    </div>
  {{ end }} */}}
{{ end }}
