{{ define "post/audios" }}
  {{ with .Helper.Audios }}
    <div class="copy">
    {{ range $i, $audio := . }}
    <figure>
      {{ with .alt }}<figcaption>{{ . }}</figcaption> {{ end }}
      <audio controls class="u-audio">
        <source src="{{ .value }}">
      </audio>
    </figure>
    {{ end }}
    </div>
  {{ end }}
{{ end }}
