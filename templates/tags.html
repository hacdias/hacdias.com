{{ define "main" }}
  <main role='main'>
    <h1>{{ .Title }}</h1>

    {{- with .Content }}
      <div class='copy'>{{ md . }}</div>
    {{- end }}

    <div class="terms">
      <ul>
        {{ range .Terms }}
          <li>
            <a href="{{ relURL (printf "/tags/%s" .) }}">{{ . }}</a>
          </li>
        {{ end }}
      </ul>
    </div>
{{ end }}

{{ define "tags" }}
  {{ template "base" . }}
{{ end }}
