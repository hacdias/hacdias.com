{{ define "main" }}
  <main role='main'>
    {{ include "base/admin" . }}

    <header>
      <h1>{{ .Title }}</h1>
    </header>

    {{- with .Content }}
      <div class='copy'>{{ md . }}</div>
    {{- end }}

    <div class="terms">
      <ul>
        {{ range .Data.Terms }}
          <li>
            <a href="{{ relURL (printf "/tags/%s" .) }}">{{ . }}</a>
          </li>
        {{ end }}
      </ul>
    </div>
{{ end }}

{{ define "tags" }}
  {{ template "base" . }}
{{ end }}
