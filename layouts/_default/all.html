{{ define "main" }}

<main role='main' class='h-feed container center'>
	{{ range where (where .Site.Pages "Kind" "page") "Type" "!=" "page" }}
		{{ $type := (lower (index (or .Params.categories (slice "")) 0 )) }}
		{{ $data := (dict "Glob" . "Type" $type "Mode" "list") }}
		{{ partial "post" $data }}
	{{ end }}
</main>

{{ end }}
