{{ define "main" }}

<main role='main'>
  <h1>{{ .Title }}</h1>

  {{- with .Content }}
    <div class='copy'>{{ . }}</div>
  {{- end }}

  <div class="terms">
    <ul>
      {{ range $i, $p := .Pages.ByTitle }}
      {{ $date := $p.Date.Format "2006-01-02" }}
        <li>
          <a href="{{ .RelPermalink }}">{{ $p.Title }}</a>
        </li>
      {{ end }}
    </ul>
  </div>
</main>

{{ end }}
