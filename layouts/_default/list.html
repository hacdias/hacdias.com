{{ define "main" }}
{{ $kind := .Kind }}

<main role='main' class='container mt4 center'>
	<h1 class='f2 mt0 mv2'>{{ .Title }}</h1>

	<div class='nested-copy-line-height'>
		{{ .Content }}
	</div>

	<ul class="list pa0 ma0">
		{{ range $i, $p := .Pages }}
		{{ $date := $p.Date.Format "2006-01-02" }}
			<li class="mv2">
				<a class="db flex no-link" href='{{ .RelPermalink }}'>
					<h3 class='ma0 mr-auto fw5 f5 truncate'>{{ $p.Title }}</h3>
					{{ if eq $kind "taxonomyTerm" }}
						<span class='ma0 ml1 db gray f5 nowrap'>{{ len $p.Pages }} posts</span>
					{{ else }}
						<time class='ma0 ml1 db gray f5 nowrap' datetime='{{ $date }}' style='font-variant-numeric: tabular-nums;'>{{ $date }}</time>
					{{ end }}
				</a>
			</li>
		{{ end }}
	</ul>
</main>

{{ end }}
