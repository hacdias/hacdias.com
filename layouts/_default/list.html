{{ define "main" }}

<main role='main' class='container center'>
	<h1 class='f2 mt0 mv2'>{{ .Title }}</h1>

	{{ with .Content }}
		<div class='nested-copy-line-height'>{{ . }}</div>
	{{ end }}

	{{ range $i, $p := .Pages }}
		{{ $type := (lower (index (or $p.Params.categories (slice "")) 0 )) }}
		{{ $data := (dict "Glob" $p "Type" $type "Mode" "list") }}
		{{ partial "post" $data }}
	{{ end }}
</main>

{{ end }}
