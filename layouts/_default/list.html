{{ define "main" }}

<main role='main'>
  <h1>{{ if eq .Kind "term" }}#{{ end }}{{ .Title }}</h1>

  {{- with .Content }}
    <div class='copy'>{{ . }}</div>
  {{- end }}

  <div class='h-feed'>
    {{- $paginator := .Paginate (partialCached "get-pages" . .Type .Title) -}}
    {{- range .Paginator.Pages -}}
      {{- partial "post/card" . -}}
    {{- end -}}
  </div>

  {{ partial "pagination" . -}}
</main>

{{ end }}
