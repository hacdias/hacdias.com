{{ define "main" }}

<style>
.terms {
	margin: 1rem 0;
}

.terms a.active {
	background: var(--action);
	color: var(--white)
}

.result .title {
  font-weight: bold;
}
</style>

<main role='main'>
  <h1>{{ .Title }}</h1>

  <div class='copy'>
    {{ with .Content }}{{ . }}{{ end }}

    <form id='search-form' class='inline-form'>
      <input aria-label="Search terms" required type='text' name='query' placeholder="What do you want to search for?" />
      <input type='submit' value='Search' style="background-color: var(--action); border-color: var(--action)" />
    </form>

    <ul class="terms">
      {{ range .Site.Sections }}
        {{ if and .Params.emoji (not (eq .Name "Log")) }}
          <li><a class='section' data-emoji='{{.Params.emoji}}' data-section='{{ lower .Title }}'>{{.Params.emoji}} {{ .Title }}</a></li>
        {{ end }}
      {{ end }}
    </ul>

    <hr>

    <div id='search-results'>
      <p>You haven't searched yet!</p>
    </div>

    <p id='more-results' class='dn' style='display: flex; font-size: var(--f6)'>
      <button style='margin-left: auto' data-page='0' onclick='search(true)'>More results…</button>
    </p>
  </div>
</main>

<script>
const sections = Array.from(document.querySelectorAll('.section'))
const input = document.querySelector('#search-form input[type="text"]')
const results = document.querySelector('#search-results')
const more = document.querySelector('#more-results')
const moreButton = more.querySelector('button')
const emojis = sections.reduce((acc, e) => {
  acc[e.dataset.section] = e.dataset.emoji
  return acc
}, {})

sections.map(el => {
  el.addEventListener('click', () => {
    el.classList.toggle('active')
    buildURL()
  })
})

document.getElementById('search-form').addEventListener('submit', event => {
  event.preventDefault()
  buildURL()
})

function buildURL() {
  moreButton.dataset.page = 0

  const state = {
    sections: sections
      .filter(el => el.classList.contains('active'))
      .map(el => el.dataset.section),
    query: input.value
  }

  const url = new URLSearchParams()
  url.set("s", state.sections.join(','))
  url.set("q", state.query)
  history.pushState(state, "Search", `?${url.toString()}`)

  search()
}

function stateFromURL() {
  const url = new URLSearchParams(window.location.search)
  const sections = (url.get('s') || '').split(',').filter(l => l)
  const query = url.get('q') || ''

  return {
    sections,
    query
  }
}

async function search(pressed) {
  if (pressed) {
    moreButton.dataset.page++
  }

  try {
    more.classList.add('dn')
    const page = Number.parseInt(moreButton.dataset.page)

    if (!stateFromURL().query) {
      results.innerHTML = `<p>You haven't searched yet!</p>`
      return
    }

    const url = `../search.json${window.location.search}&p=${page}`
    const res = await fetch(url)
    const data = await res.json()

    if (!Array.isArray(data)) {
      throw new Error('response is not array')
    }

    if (data.length === 0 && page === 0) {
      results.innerHTML = '<p>No results found for this search…</p>'
      return
    }

    if (page === 0) {
      results.innerHTML = ''
    }

    for (let { _formatted: { content, id, title, date, section } } of data) {
      id = '..' + id
      emoji = emojis[section] || '📄'

      if (!title) {
        if (content) {
          title = content
          if (!(title.endsWith('.') || title.endsWith('?') || title.endsWith('!'))) title += "…"
        } else {
          title = 'A note'
        }
      }

      if (date) {
        date = new Date(date)
        const year = date.getFullYear()
        const month = date.toLocaleString('en', { month: 'long' })
        if (year === 1) {
          date = ''
        } else {
          date = `<small> on ${month} ${year}</small>`
        }
      } else {
        date = ''
      }

      results.innerHTML += `<p><a href="${id}" class="result nl">${emoji} <span class="title">${title}</span> ${date}</a></p>`
    }

    if (data.length == 20) {
      more.classList.remove('dn')
    }

    parseEmojis(results)
  } catch (err) {
    results.innerHTML = `<p style="color:red">An error occurred: ${err.toString()}</p>`
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const state = stateFromURL()
  input.value = state.query
  sections.forEach(s => s.classList
    .toggle('active', state.sections
      .includes(s.dataset.section)
    )
  )

  search()
  window.addEventListener('popstate', () => search())
})
</script>

<noscript>Unfortunately, this page doesn't work without JavaScript enabled 😭</noscript>

{{ end }}
