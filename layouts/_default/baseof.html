<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head" . -}}
</head>
<body>
  <div class='container'>
    {{ if not .IsHome }}
      <a id="home" alt="Return home" class="no-link" href="{{ relURL .Site.BaseURL }}"><span>← back home</span></a>
    {{ end }}
    {{ block "main" . -}}{{ end }}
    {{ partial "footer" . -}}
  </div>

  <script>twemoji.parse(document.body, {
    folder: 'svg',
    ext: '.svg'
  });</script> -->
</body>
</html>
