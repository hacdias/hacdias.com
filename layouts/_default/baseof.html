<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head" . -}}
</head>
<body>
  <div class='container'>
    <div id='header'>
      <input type="checkbox" id="toggler">
      <nav>
        <label for="toggler"><a class='no-link'>Menu</a></label>
        {{- range .Site.Menus.main -}}
          <a href='{{ .URL }}' class='no-link {{ if $.IsMenuCurrent "main" . }}a{{ end }}'>{{ .Name -}}</a>
        {{- end -}}
      </nav>
    </div>

    {{ block "main" . -}}{{ end }}
    {{ partial "footer" . -}}
  </div>

  {{ $js := resources.Get "js/vendor/twemoji.min.js" }}
  {{ $secureJS := $js | resources.Fingerprint "sha512" }}
  <script type="text/javascript" src="{{ $secureJS.RelPermalink }}" integrity="{{ $secureJS.Data.Integrity }}"></script>
  <script>twemoji.parse(document.body, {
    base: 'https://cdn.hacdias.com/emojis/13.0.0/',
    folder: 'svg',
    ext: '.svg'
  });</script>
</body>
</html>
