<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head" . -}}
</head>
<body {{ with .Section }}class="section-{{ . }}"{{ end }}>
  {{ $js := resources.Get "js/theme.js" }}
  <script>{{ $js.Content | safeJS }}</script>
  {{ partial "navbar" . -}}
  <div class='container'>
    {{ block "main" . -}}{{ end }}
    {{ partial "footer" . -}}
  </div>
</body>
</html>
