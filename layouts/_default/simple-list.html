{{ define "main" }}

<style>
	.list {
		list-style-type: none;
		padding: 0;
		margin: 0;
	}

	.list li {
		margin: 0.5rem 0;
	}

	.list a {
		display: flex;
	}

	.list h3 {
		white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 1rem;
    margin: 0;
		font-weight: 500;
		margin-right: auto;
	}

	.list time {
		white-space: nowrap;
    font-size: 1rem;
    margin-left: .25rem;
    margin: 0;
    color: var(--gray);
    display: block;
		font-variant-numeric: tabular-nums;
	}
</style>

<main role='main'>
	{{ if not .Params.hideTitle }}
	<h1>{{ .Title }}</h1>
	{{ end }}

	{{ with .Content }}
		<div class='copy'>{{ . }}</div>
	{{ end }}

	<ul class="list">
		{{ range $i, $p := .Pages }}
		{{ $date := $p.Date.Format "2006-01-02" }}
			<li>
				<a class="no-link" href='{{ .RelPermalink }}'>
					<h3>{{ $p.Title }}</h3>
					<time datetime='{{ $date }}'>{{ $date }}</time>
				</a>
			</li>
		{{ end }}
	</ul>
</main>

{{ end }}
