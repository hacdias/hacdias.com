{{ $links := partialCached "fns/external-links" . }}
{{ $json := $links | jsonify (dict "indent" "  ") }}
{{ $_ := (resources.FromString ".well-known/links" $json).Publish }}

<ul class='tb nw'>
  {{ range first 25 $links }}
    <li>
      <span>{{ partialCached "favicon" .domain .domain }} {{ .domain }}</span>
      <span class='tab lg small tr'>{{ .count }}</span>
    </li>
  {{ end }}
</ul>
