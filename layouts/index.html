{{ define "main" }}

<main role='main'>
  <article class='container mt4 nested-copy-line-height'>
    {{ .Content }}
  </article>

  <div class='container'>
    {{ $paginator := .Paginate (where .Pages "Section" "!=" "") }}
    {{ partial "pagination" $paginator }}
  </div>
</main>

<a href='{{ "/galaxy/" | relURL }}' id='shooting-star' class='no-shadow fixed f3 ma2'>🌟</a>

{{ end }}
