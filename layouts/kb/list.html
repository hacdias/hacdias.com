{{ define "main" }}

<main role='main'>
	{{- if not .Params.hideTitle -}}
	<h1>{{ .Title }}</h1>
	{{- end -}}

	{{- with .Content }}
		<div class='copy'>{{ . }}</div>
  {{- end }}

  <ul>
		{{ range .Pages }}
			<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
		{{ end }}
	</ul>	
</main>

{{ end }}
