{{ define "main" }}

<style>
	.terms {
		list-style-type: none;
		padding: 0;
		margin: 0;
	}

	.terms li {
		display: inline-block;
	}

	.terms a,
	.terms a:visited {
		margin: .25rem;
		font-size: .875rem;
    padding: .5rem;
    background-color: var(--near-white);
    color: var(--gray);
    display: inline-block;
	}
</style>

<main role='main'>
	{{- if not .Params.hideTitle -}}
	<h1>{{ .Title }}</h1>
	{{- end -}}

	{{- with .Content }}
		<div class='copy'>{{ . }}</div>
  {{- end }}

  <ul class='terms'>
		{{ range .Pages }}
			<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
		{{ end }}
	</ul>	
</main>

{{ end }}
