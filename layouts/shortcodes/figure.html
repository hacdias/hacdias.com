<figure {{ with .Get "class" }}class="{{ . }}"{{ end }}>
  {{- if .Get "link" -}}
    <a href="{{ .Get "link" }}"{{ with .Get "target" }} target="{{ . }}"{{ end }}{{ with .Get "rel" }} rel="{{ . }}"{{ end }}>
  {{- end }}

  {{ $cdn := .Get "cdn" }}
  {{ $src := .Get "src" }}
  {{ $media := $.Page.Resources.GetMatch (.Get "src") }}

  {{ if $cdn }}
    <picture>
      <source srcset="https://cdn.hacdias.com/i/t/{{ $cdn }}-250x.webp 250w, https://cdn.hacdias.com/i/t/{{ $cdn }}-500x.webp 500w, https://cdn.hacdias.com/i/t/{{ $cdn }}-1000x.webp 1000w, https://cdn.hacdias.com/i/t/{{ $cdn }}-2000x.webp 2000w" type="image/webp">
      <source srcset="https://cdn.hacdias.com/i/t/{{ $cdn }}-250x.jpeg 250w, https://cdn.hacdias.com/i/t/{{ $cdn }}-500x.jpeg 500w, https://cdn.hacdias.com/i/t/{{ $cdn }}-1000x.jpeg 1000w, https://cdn.hacdias.com/i/t/{{ $cdn }}-2000x.jpeg 2000w">
      <img src="https://cdn.hacdias.com/i/t/{{ $cdn }}-2000x.jpeg" loading="lazy"
      {{- if or (.Get "alt") (.Get "caption") }}
      alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
      {{- end -}}  >
    </picture>
  {{ else }}
    {{ if $media }}
      {{ $src = $media.RelPermalink }}
    {{ end }}

    <picture>
      <img src="{{ $src }}"
        {{- if or (.Get "alt") (.Get "caption") }}
        alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
        {{- end -}} >
    </picture>
  {{ end }}

  {{- if .Get "link" }}</a>{{ end -}}

  {{- if (.Get "caption")  -}}
    <figcaption>
      {{- if .Get "caption" -}}<p>
        {{- .Get "caption" | markdownify -}}
      {{- end }}
    </figcaption>
  {{- end }}
</figure>
