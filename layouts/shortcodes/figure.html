<figure {{ with .Get "class" }}class="{{ . }}"{{ end }} {{ with .Get "style" }}style="{{ . | safeCSS }}"{{ end }}>
  {{- if .Get "link" -}}
    <a href="{{ .Get "link" }}"{{ with .Get "target" }} target="{{ . }}"{{ end }}{{ with .Get "rel" }} rel="{{ . }}"{{ end }}>
  {{- end }}

  {{ $cdn := .Get "cdn" }}
  {{ $src := .Get "src" }}
  {{ $media := $.Page.Resources.GetMatch (.Get "src") }}

  {{ if $cdn }}
    <picture>
      <source srcset="https://cdn.hacdias.com/i/t/{{ $cdn }}-250x.webp 250w, https://cdn.hacdias.com/i/t/{{ $cdn }}-500x.webp 500w, https://cdn.hacdias.com/i/t/{{ $cdn }}-1000x.webp 1000w, https://cdn.hacdias.com/i/t/{{ $cdn }}-2000x.webp 2000w" type="image/webp">
      <source srcset="https://cdn.hacdias.com/i/t/{{ $cdn }}-250x.webp 250w, https://cdn.hacdias.com/i/t/{{ $cdn }}-500x.jpeg 500w, https://cdn.hacdias.com/i/t/{{ $cdn }}-1000x.jpeg 1000w, https://cdn.hacdias.com/i/t/{{ $cdn }}-2000x.jpeg 2000w">
      <img src="https://cdn.hacdias.com/i/t/{{ $cdn }}-2000x.jpeg" loading="lazy"
      {{- if or (.Get "alt") (.Get "caption") }}
      alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
      {{- end -}}
      {{- with .Get "width" }} width="{{ . }}"{{ end -}}
      {{- with .Get "height" }} height="{{ . }}"{{ end -}} >
    </picture>
  {{ else if $media }}
    {{ if in $media.MediaType.Suffixes "svg" }}
      {{ $media.Content | safeHTML }}
    {{ else }}
      <picture>
        {{ if not (in $media.MediaType.Suffixes "gif") }}
          {{ $1000 := $media.Resize "1000x" }}
          {{ $2000 := $media.Resize "2000x" }}
          <source srcset="{{ $1000.RelPermalink }} 1000w, {{ $2000.RelPermalink }} 2000w">
        {{ end }}
        <img src="{{ $media.RelPermalink }}"
          {{- if or (.Get "alt") (.Get "caption") }}
          alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
          {{- end -}}
          {{- with .Get "width" }} width="{{ . }}"{{ end -}}
          {{- with .Get "height" }} height="{{ . }}"{{ end -}} >
      </picture>
    {{ end }}
  {{ else }}
  <picture>
    <img src="{{ .Get "src" }}"
      {{- if or (.Get "alt") (.Get "caption") }}
      alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
      {{- end -}}
      {{- with .Get "width" }} width="{{ . }}"{{ end -}}
      {{- with .Get "height" }} height="{{ . }}"{{ end -}} >
  </picture>
  {{ end }}

  {{- if .Get "link" }}</a>{{ end -}}

  {{- if or (or (.Get "title") (.Get "caption")) (.Get "attr") -}}
    <figcaption>
      {{ with (.Get "title") -}}
        <h4>{{ . }}</h4>
      {{- end -}}
      {{- if or (.Get "caption") (.Get "attr") -}}<p>
        {{- .Get "caption" | markdownify -}}
        {{- with .Get "attrlink" -}}
          <a href="{{ . }}">
        {{- end -}}
        {{- .Get "attr" | markdownify -}}
        {{- if .Get "attrlink" }}</a>{{ end }}</p>
      {{- end }}
    </figcaption>
  {{- end }}
</figure>
