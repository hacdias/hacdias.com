{{ define "main" }}

<main role='main'>
  <article class='h-entry'>
    <header>
      <div>
        {{ with .Title }}<h1 class='p-name'>{{- . -}}</h1>{{ end }}

        <p>
          <time class='dt-updated' datetime='{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}'>
            <a href="{{ .RelPermalink }}" class="u-url no-link">{{ .Lastmod.Format "2 Jan 2006" }}</a>
          </time>
        </p>
      </div>

      {{ with .Params.cover }}
      <figure>
        <picture>
          <source srcset="https://cdn.hacdias.com/i/t/{{ .slug }}-1000x.webp 1000w, https://cdn.hacdias.com/i/t/{{ .slug }}-2000x.webp 2000w" type="image/webp">
          <source srcset="https://cdn.hacdias.com/i/t/{{ .slug }}-1000x.jpeg 1000w, https://cdn.hacdias.com/i/t/{{ .slug }}-2000x.jpeg 2000w">
          <img class='u-photo' src="https://cdn.hacdias.com/i/t/{{ .slug }}-2000x.jpeg" alt="{{ .title }}" title="{{ .title }}">
        </picture>
      </figure>
      {{ end }}
    </header>

    {{ with .Content }}
    <div class='copy e-content'>{{ . }}</div>
    {{ end }}

    {{ partialCached "post/metadata" . .Permalink }}
  </article>
</main>


{{ end }}
