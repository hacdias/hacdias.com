{{ $notPhotos := not (eq .Section "photos") }}

{{ if $notPhotos }}
<div id='header'>
  <a class='nl' href='{{ relURL .Site.BaseURL }}'>
    <img alt='Logo' src="{{ relURL "/logo.svg" }}">
    <div>
      <p class='name'>Henrique Dias</p>
      <p class='aka'>aka @hacdias</p>
    </div>
  </a>
</div>
{{ end }}

<nav id='navbar' {{ if $notPhotos }}class='fw'{{ end }}>
  <input type="checkbox" id="toggler">
  <ul>
    <li><label for="toggler"><a class='nl'>🍔 Touch me</a></label></li>
    {{ if eq .Section "photos" }}
      <li>
        <a href='{{ relURL "/" }}' class='nl'>
          <span>Home</span>
        </a>
      </li>
    {{ end }}
    {{ range .Site.Menus.main -}}
      <li>
        <a href='{{ relURL .URL }}' class='nl'>
          <span>{{ if $notPhotos }}{{ .Pre }} {{end}}{{ .Name }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
