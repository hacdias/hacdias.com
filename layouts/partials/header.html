{{ $notPhotos := not (eq .Section "photos") }}

{{ if $notPhotos }}
<div id='header'>
  <a class='no-link' href='{{ relURL .Site.BaseURL }}'>
    <img src="{{ relURL "/logo.svg" }}">
    <div>
      <p class='name'>Henrique Dias</p>
      <p class='aka'>aka @hacdias</p>
    </div>
  </a>
</div>
{{ end }}

<nav id='navbar' {{ if $notPhotos }}class='full-width'{{ end }}>
  <input type="checkbox" id="toggler">
  <ul>
    <label for="toggler"><a class='no-link'>🍔 Touch me</a></label>
    {{ if eq .Section "photos" }}
      <li>
        <a href='{{ relURL "/" }}' class='no-link'>
          <span>Home</span>
        </a>
      </li>
    {{ end }}
    {{ range .Site.Menus.main -}}
      <li>
        <a href='{{ relURL .URL }}' class='no-link'>
          <span>{{ if $notPhotos }}{{ .Pre }} {{end}}{{ .Name }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
