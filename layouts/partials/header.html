<div id='header'>
  <div>
    <a class='nl' href='{{ relURL .Site.BaseURL }}'>
      <img class="logo" alt='Logo' src="{{ relURL "/logo.svg" }}">
      <div>
        <p class='name'>Henrique Dias</p>
        <p class='aka'>aka @hacdias</p>
      </div>
    </a>
    <label for="toggler">Menu 🍔</label>
  </div>

  {{ if not (eq .Title "Search") }}
    <form action="{{ relURL "/search" }}" method="get">
      <input required type="text" placeholder='Search…' id="query" name="q">
    </form>
  {{ end }}
</div>

<nav id='navbar' class='fw'>
  <input type="checkbox" id="toggler">
  <ul>
    {{ range .Site.Menus.main -}}
      <li>
        <a href='{{ .Page.RelPermalink }}' class='nl'>
          {{- or .Pre .Page.Params.emoji }} {{ .Name -}}
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
