<ul class="list pa0 ma0">
  {{ range $i, $p := .Pages }}
  {{ $date := $p.Date.Format "2006-01-02" }}
    <li class="mv2">
      <a class="db flex-ns no-link" href='{{ .RelPermalink }}'>
        <h3 class='ma0 mr-auto fw5 f5'>{{ $p.Title }}</h3>
        <time class='ma0 db gray f5' datetime='{{ $date }}' style='font-variant-numeric: tabular-nums;'>{{ $date }}</time>
      </a>
    </li>
  {{ end }}
</ul>
