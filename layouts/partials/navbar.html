<div class="site-header">
  <input type="checkbox" id="toggler">
  <nav>
    <label for="toggler"><a>Menu</a></label>
    <a href='{{ relURL .Site.BaseURL }}' class='no-link'>Henrique Dias</a>
    {{- range .Site.Menus.main -}}
      <a href='{{ .URL }}' class='no-link {{ if $.IsMenuCurrent "main" . }}a{{ end }}'>{{ .Name -}}</a>
    {{- end -}}
  </nav>
</div>
