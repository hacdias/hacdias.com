{{- $checkin := .Glob.Params.properties.checkin.properties -}}
<p class='copy content p-summary e-entry'>
  <span class="p-name">At
    <span class="u-checkin h-card">
      <a target="_blank" rel="noopener noreferrer" href="{{ $checkin.url }}" class="p-name">{{ $checkin.name }}</a>
      <data class="p-latitude" value="{{ $checkin.latitude }}"></data>
      <data class="p-longitude" value="{{ $checkin.longitude }}"></data>
    </span>
  </span>
</p>
