version: 2
jobs:
  build:
    docker:
      - image: circleci/golang:latest
    working_directory: ~/hugo
    steps:
      - run:
          name: Install Hugo
          command: /
            cd ~
            curl -L https://github.com/gohugoio/hugo/releases/download/v0.64.1/hugo_extended_0.64.1_Linux-64bit.tar.gz | tar xvz
            mv hugo /usr/local/bin/hugo
            cd hugo
      - checkout
      - run: hugo --gc --minify
      - persist_to_workspace:
          root: .
          paths:
            - public

  deploy:
    docker:
      - image: circleci/node:10
        environment:
          IPFS_DEPLOY_CLOUDFLARE__ZONE: hacdias.com
          IPFS_DEPLOY_CLOUDFLARE__RECORD: _dnslink.hacdias.com
          BUILD_DIR: public
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Pin website, post notification for PRs or update DNS on master
          command: |
            if [ "$CIRCLE_BRANCH" == "master" ] ; then
              npx ipfs-deploy /tmp/workspace/$BUILD_DIR -C -O -u pinata -p ipfs-cluster -d cloudflare
            fi
workflows:
  version: 2
  build-deploy:
    jobs:
      - build
      - deploy:
          context: ipfs-deploy
          requires:
            - build
