version: 2
jobs:
  build:
    docker:
      - image: cibuilds/hugo:latest
    working_directory: ~/hugo
    steps:
      - run: apk update && apk add git
      - checkout
      - run: hugo --gc --minify
      - persist_to_workspace:
          root: .
          paths:
            - public

  deploy:
    docker:
      - image: olizilla/ipfs-dns-deploy:1.2
        environment:
          DOMAIN: hacdias.com
          BUILD_DIR: public
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Pin website, post notification for PRs or update DNS on master
          command: |
            pin_name="$DOMAIN build $CIRCLE_BUILD_NUMBER"

            hash=$(pin-to-cluster.sh "$pin_name" /tmp/workspace/$BUILD_DIR)

            echo "Website added to IPFS: https://ipfs.io/ipfs/$hash"

            if [ "$CIRCLE_BRANCH" == "master" ] ; then
              curl -X POST \
                -H "Content-Type: application/json" \
                -H "pinata_api_key: $PINATA_API" \
                -H "pinata_secret_api_key: $PINATA_SECRET" \
                -d "{\"hashToPin\":\"$hash\"}" \
                https://api.pinata.cloud/pinning/addHashToPinQueue

              npx dnslink-cloudflare -d $DOMAIN -r _dnslink -l /ipfs/$hash
            fi
workflows:
  version: 2
  build-deploy:
    jobs:
      - build
      - deploy:
          context: IPFS Pinning
          requires:
            - build
